[project]
name = "MyJourney"
version = "7.3.0"
description = "Personal travel atlas: journeys, cities and routes on a globe"
authors = [
    { name = "Dzmitry Zhybryk", email = "mr.zhybryk@gmail.com" }
]
requires-python = ">=3.14,<3.15"
readme = "README.md"

dependencies = [
    "fastapi[standard]>=0.159.1",
    "alembic>=1.20.1",
    "orjson>=3.13.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "httpx>=0.28.0",
    "procrastinate>=3.10.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "aiobotocore>=3.10.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-semantic-conventions>=0.66b1",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
    "tach>=0.35.3",
    "testcontainers[postgres]>=4.15.0",
    "ty>=0.0.90",
    "types-aiobotocore-s3>=3.10.0",
    "vulture>=2.16",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "--strict-markers --durations=5"
markers = [
    # Ось «уровень» (выводится из tests/<level>/... авто-маркировкой в conftest)
    "unit: быстрые тесты без I/O (domain, application с фейками, чистые helpers)",
    "integration: тесты против реального Postgres",
    "api: тесты с поднятием ASGI-приложения",
    # Ось «домен» (выводится из tests/<level>/<domain>/...)
    "auth: тесты домена auth",
    "users: тесты домена users",
    "shared: тесты shared-инфраструктуры",
    "journeys: тесты домена journeys",
    "geo: тесты домена geo",
    "health: тесты домена health",
    "media: тесты домена media",
]

[tool.coverage.run]
omit = [
    "app/__main__.py",
    "app/geo/infra/datasets/__main__.py",
    "app/geo/infra/datasets/wikidata/__main__.py",
    "app/geo/infra/datasets/wikidata_places/__main__.py",
    "app/shared/infra/procrastinate/__main__.py",
]

[tool.ruff]
line-length = 120
exclude = [
    # for local development
    "service-lib",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules
select = [
    "E",     # pycodestyle (Error)
    "W",     # pycodestyle (Warning)
    "F",     # Pyflakes
    "C90",   # mccabe - name is too complex
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit - security issues
    "B",     # flake8-bugbear - common bugs
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "ERA",   # eradicate - Found commented-out code
    "PLE",   # Pylint Error
    "TRY",   # tryceratops
    "RUF",   # Ruff-specific rules (unused imports, etc.)
    "PERF",  # Performance checks
]
unfixable = [
    "ERA", # do not autoremove commented out code
]
ignore = [
    "RUF001", # Это и ниже для того, чтобы разрешить кириллицу в комментариях/docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Тестовые идиомы pytest: assert (S101), мусорные секреты в фикстурах/билдерах
# (S105/S106/S107), магические значения в проверках (PLR2004) — норма для тестов.
"tests/*" = ["S101", "S105", "S106", "S107", "PLR2004"]

"migrations/versions/*" = []

[tool.ruff.lint.pep8-naming]
# Allow Pydantic's `@validator` decorator to trigger class method treatment.
# https://github.com/astral-sh/ruff/issues/2868
classmethod-decorators = ["pydantic.validator", "pydantic.root_validator"]

[tool.ty.rules]
unused-ignore-comment = "warn"
redundant-cast = "ignore"
possibly-missing-attribute = "error"
possibly-missing-import = "error"

[tool.ty]
# Override rules for specific files
# Pydantic Settings loads values from .env at runtime, so missing-argument is expected
overrides = [
    { include = ["app/shared/settings.py"], rules = { "missing-argument" = "ignore" } },
]

[tool.vulture]
paths = ["app", "vulture_whitelist.py"]
min_confidence = 60
# Декораторы, после которых vulture не должен считать функцию мёртвой:
# фреймворк (FastAPI/Starlette) или Pydantic вызывают такие функции неявно.
ignore_decorators = [
    # FastAPI/APIRouter HTTP-методы (любой роутер: app, router, *_router)
    "@*.get",
    "@*.post",
    "@*.put",
    "@*.delete",
    "@*.patch",
    "@*.head",
    "@*.options",
    "@*.exception_handler",
    "@*.middleware",
    "@*.on_event",
    # Procrastinate-таски (вызываются воркером по регистрации в blueprint, как FastAPI-роуты)
    "@*.task",
    # Pydantic-валидаторы
    "@field_validator",
    "@model_validator",
    "@validator",
    "@root_validator",
    # Контекст-менеджеры lifespan
    "@asynccontextmanager",
    "@contextmanager",
]
