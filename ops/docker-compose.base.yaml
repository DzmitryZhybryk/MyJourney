# Общая часть стеков dev, e2e и prod: из чего собраны сервисы и в каком порядке стартуют.
# Не запускается сам по себе — только первым файлом под override стека (корневой Makefile,
# `-f ops/docker-compose.base.yaml -f ops/docker-compose.<стек>.yaml`).

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env

services:

  myjourney_pg:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -c log_min_messages=warning
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Одноразовый прогон перед стартом app/worker; шаги — в backend/bootstrap.sh. Гейт
  # service_completed_successfully гарантирует, что всё это готово до старта.
  myjourney_migrate:
    <<: *backend
    command: ./bootstrap.sh
    depends_on:
      myjourney_pg:
        condition: service_healthy
    restart: "no"

  # One-shot: грузит газеттир после миграций; уже загруженные версии датасетов пропускает.
  myjourney_geo_load:
    <<: *backend
    command: python -m app.geo.scripts.load_datasets
    depends_on:
      myjourney_migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    <<: *backend
    depends_on:
      myjourney_pg:
        condition: service_healthy
      myjourney_migrate:
        condition: service_completed_successfully
      myjourney_geo_load:
        condition: service_completed_successfully

  myjourney_worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      myjourney_pg:
        condition: service_healthy
      myjourney_migrate:
        condition: service_completed_successfully
