name: myjourney

# ─────────────────────────────────────────────────────────────────────────────
# ПРОД-стек, override поверх docker-compose.base.yaml. Отличия от dev:
#   • образы pull'ятся из GHCR (build оставлен для локальной сборки/отладки);
#   • НЕТ проброса портов у внутренних сервисов (postgres/loki/grafana/app/frontend) —
#     наружу торчит только Caddy (80/443). ВАЖНО: docker `ports:` обходит ufw, поэтому
#     единственная публичная точка входа — Caddy;
#   • app/worker/frontend на prod-таргете `final` (без volume-mount и --reload).
#
# Пути внутри резолвятся от КОРНЯ репо (запуск через `make prod-*` с --project-directory .),
# поэтому build-context ./backend и конфиги ./ops/... указаны относительно корня, не ops/.
#
# Деплой:  make prod-pull && make prod-up
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-prod-backend: &prod-backend
  image: ghcr.io/dzmitryzhybryk/myjourney-backend:${IMAGE_TAG:-latest}
  build:
    target: final
  networks:
    - default
  logging: *default-logging

networks:
  default:
    name: myjourney-network
    external: true

services:

  caddy:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    container_name: myjourney_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # выпущенные TLS-сертификаты — НЕ удалять
      - caddy_config:/config
    depends_on:
      - app
      - frontend
    networks:
      - default
    logging: *default-logging

  myjourney_migrate:
    <<: *prod-backend
    container_name: myjourney_migrate

  # Кеш во /tmp: образ работает под nonroot.
  myjourney_geo_load:
    <<: *prod-backend
    container_name: myjourney_geo_load
    environment:
      GEO_DATASETS_CACHE_DIR: /tmp/geo-datasets

  app:
    <<: *prod-backend
    container_name: myjourney_app
    # --forwarded-allow-ips: доверять X-Forwarded-For только от прокси из docker-подсети
    # (172.16.0.0/12 покрывает bridge-сеть myjourney-network) → request.client.host = реальный
    # IP клиента, а не внутренний адрес Caddy. НЕ ставить '*': Caddy аппендит XFF, и с '*'
    # uvicorn берёт leftmost-значение → клиент подделает свой IP в аудите/rate-limit.
    command: uvicorn app.main:create_app --factory --no-use-colors --host 0.0.0.0 --port 8000 --log-level error --forwarded-allow-ips=172.16.0.0/12
    healthcheck:
      # slim-образ без curl — пробуем /healthz/ через python; не-200 бросает исключение -> unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  myjourney_worker:
    <<: *prod-backend
    container_name: myjourney_worker
    restart: unless-stopped

  frontend:
    image: ghcr.io/dzmitryzhybryk/myjourney-frontend:${IMAGE_TAG:-latest}
    build:
      target: final
    container_name: myjourney_frontend
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

  myjourney_pg:
    container_name: myjourney_pg
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: myjourney_loki
    command: -config.file=/etc/loki/loki.yaml -log.level=error -target=all
    volumes:
      - loki_data:/loki
      - ./ops/loki.yaml:/etc/loki/loki.yaml:ro
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: myjourney_alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

  # Grafana наружу НЕ публикуется (нет ports, Caddy её не проксирует). Доступ админа —
  # по SSH-туннелю к 3000 (см. docs/deployment.md).
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    container_name: myjourney_grafana
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

  # Автоматический бэкап БД: pg_dump по расписанию + ротация (daily/weekly/monthly).
  # Дампы лежат в volume pg_backups на диске сервера. ВАЖНО: это защита от логической
  # порчи данных, но не от гибели диска — для настоящей durability копируй pg_backups во
  # внешнее хранилище (S3/rclone) отдельным cron, плюс тарифные снапшоты сервера
  # (см. docs/deployment.md → Бэкапы и восстановление). Восстановление: docs/deployment.md.
  myjourney_pg_backup:
    image: prodrigestivill/postgres-backup-local:17@sha256:e803bd9eb4bfb42e9b3e74ba411227f3d55da292905800395659cc579b6641e8
    container_name: myjourney_pg_backup
    environment:
      POSTGRES_HOST: myjourney_pg
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"          # ежедневный дамп (cron-алиас образа)
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - pg_backups:/backups
    depends_on:
      myjourney_pg:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

volumes:
  pg_data:
  pg_backups:
  loki_data:
  alloy_data:
  grafana_data:
  caddy_data:
  caddy_config:
