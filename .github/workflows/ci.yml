name: CI

# Быстрый гейт: на каждый PR (dev и main) и push main — lint, typecheck, unit/api/component.
# Тяжёлые тесты (integration + e2e), сборка образов и деплой вынесены в prod.yml и триггерятся
# только на пути в прод (PR -> main / push main), поэтому на PR -> dev здесь НЕТ skipped-чеков.
# Блокировка мержа при красных — через branch protection (Required status checks) в настройках репо.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

# Отменяем устаревшие прогоны только для PR; на push main гейт не прерываем.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Через env, а не флагом: иначе `uv run` внутри make молча перепишет устаревший uv.lock,
    # и гейт останется зелёным, а `uv sync --locked` в Dockerfile упадёт уже по пути в прод.
    env:
      UV_LOCKED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync deps (locked; Python по requires-python из pyproject.toml)
        run: uv sync

      - name: Quality gate (format-check, lint, typecheck, arch, dead-code, audit, unit+api)
        run: make check-ci

  frontend:
    name: Frontend gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps (ci)
        run: npm ci

      - name: Codegen drift (src/api/generated == backend/openapi.json)
        run: |
          make generate-api
          git diff --exit-code -- src/api/generated \
            || { echo "::error::SDK устарел — прогони 'make fe-generate-api' и закоммить результат"; exit 1; }

      - name: Codegen drift (src/data/world-countries.topo.json == data/world-countries.geo.json)
        run: |
          make generate-world
          git diff --exit-code -- src/data/world-countries.topo.json \
            || { echo "::error::Границы стран устарели — прогони 'make fe-generate-world' и закоммить результат"; exit 1; }

      - name: Quality gate (lint, typecheck, unit+component)
        run: make check

      - name: Bundle budget (prod build, static import graph per page)
        run: make budget
