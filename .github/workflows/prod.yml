name: Prod

# Путь в прод — триггерится ТОЛЬКО на PR -> main и push main (на PR -> dev не запускается вовсе):
#   • PR -> main: тяжёлый гейт (integration + e2e) перед мержем. build/deploy тут ещё не нужны.
#   • push main:  integration + e2e -> build-push -> deploy (строгая связка через needs:
#                 деплой стартует ТОЛЬКО после зелёных тяжёлых тестов и успешной сборки образов).
# Быстрый гейт (Backend/Frontend gate) живёт в ci.yml; его обязательность для мержа в main
# обеспечивает branch protection (Required status checks), а не needs между воркфлоу.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# На push main (build+deploy) НЕ отменяем на полпути — новые пуши сериализуются в очередь той же
# группы (cancel-in-progress: false); устаревшие PR-прогоны отменяем.
concurrency:
  group: prod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # GHCR требует lowercase-владельца; совпадает с image: в ops/docker-compose.prod.yaml.
  IMAGE_BASE: ghcr.io/dzmitryzhybryk

jobs:
  # ── Тяжёлый гейт: и на PR -> main, и на push main (без if — воркфлоу и так триггерится только тут) ──
  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Через env, а не флагом: иначе `uv run` внутри make молча перепишет устаревший uv.lock.
    env:
      UV_LOCKED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync deps (locked; Python по requires-python из pyproject.toml)
        run: uv sync

      # testcontainers поднимает одноразовый Postgres через Docker-демон ubuntu-runner.
      - name: Integration tests (testcontainers)
        run: make test-integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps (ci)
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # e2e-стек ждёт корневой .env (env_file: .env в ops/docker-compose.base.yaml). В репозитории
      # .env нет (в .gitignore) — кладём тестовые значения из ops/.env.e2e (не секреты, tmpfs-БД).
      - name: Provide .env for ephemeral e2e stack (test-only values)
        run: cp ops/.env.e2e .env

      # geo-load e2e-стека берёт датасет мест из backend/.geo-cache и качает с GitHub Releases
      # только при промахе. Ключ — манифест: новый датасет = новый ключ.
      - name: Cache geo datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: backend/.geo-cache
          key: geo-datasets-${{ hashFiles('backend/app/geo/infra/datasets/manifest.toml') }}

      # make test-e2e (из корня) сам поднимает одноразовый стек (ops/docker-compose.e2e.yaml),
      # гоняет Playwright (config CI-aware: retries=1, workers=2) и сносит стек с -v.
      - name: E2E (ephemeral stack + Playwright)
        run: make test-e2e

      # Контейнер пишет кеш от root с правами 0600 — без смены владельца пост-шаг кеша
      # не прочитает файл и молча ничего не сохранит.
      - name: Hand geo cache back to runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" backend/.geo-cache || true

  # ── Сборка образов: только push main И только после зелёных тяжёлых тестов (строгая связка) ──
  build-push:
    name: Build & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: myjourney-backend
          - name: frontend
            context: ./frontend
            image: myjourney-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: final
          push: true
          # :latest — для make prod-pull по умолчанию; :sha — иммутабельный тег для деплоя/отката.
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── Деплой на VPS: только после успешной сборки образов ──
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Деплой-секреты (SSH_*, DEPLOY_PATH) живут в environment `production`, привязанном к main
    # (deployment branch policy). В отличие от repo-секретов, их физически не может прочитать
    # workflow из другой ветки — закрывает вектор «украденный токен → мусорная ветка с
    # workflow, читающим секреты» (GhostAction/Megalodon-класс атак). `if` выше — про то,
    # КОГДА деплоить; environment — про то, КОМУ доступны секреты.
    environment: production
    # Деплой ходит только по SSH — GITHUB_TOKEN не нужен вовсе. Явный пустой набор прав
    # вместо унаследованного contents: read (принцип наименьших привилегий).
    permissions: {}
    # github.sha пробрасываем как env и используем внутри script как $GIT_SHA (а не inline-подстановкой)
    # — best practice против инъекций в run/script.
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Pull images & restart stack over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GIT_SHA,DEPLOY_PATH
          # DEPLOY_PATH — путь к склонированному репо на сервере (там же лежит прод .env, не в git).
          # git pull подтягивает свежие ops/*.yaml и Caddyfile; образы приходят из GHCR по :sha.
          # Миграции прогоняет one-shot myjourney_migrate (gate внутри make prod-up).
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git pull --ff-only
            IMAGE_TAG="$GIT_SHA" make prod-pull
            IMAGE_TAG="$GIT_SHA" make prod-up
            docker system prune -f
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
