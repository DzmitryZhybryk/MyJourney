# Dependabot: держит закреплённые на commit-SHA GitHub Actions в актуальном состоянии.
# Экшены запинены на SHA (supply-chain hardening) — Dependabot раз в неделю поднимает PR с
# обновлением SHA до свежих релизов, иначе пины заморозили бы и security-патчи самих экшенов.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Один PR на все обновления экшенов вместо N отдельных.
      github-actions:
        patterns:
          - "*"

  # Python-зависимости бэка (uv.lock). До 2026-08-07 эта экосистема отсутствовала — advisories
  # транзитивных пакетов (click, gitpython) прилетали только красным `uv audit` в гейте CI,
  # и бампить приходилось руками (`uv lock --upgrade-package ...`). Теперь Dependabot приносит
  # готовый PR; ночной audit.yml остаётся быстрым сигналом (weekly-каденс медленнее advisory).
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # Симметрия с npm-группой ниже: minor/patch — одним тихим PR, мажоры — отдельными.
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm-зависимости фронта (симметрия с backend: uv audit в CI ловит уязвимости).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # minor/patch — одним тихим PR; мажоры выпадают из группы и приходят отдельными PR
      # как сигнал к осознанному апгрейду (React/Vite/Mantine major и т.п. — своя задача).
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Намеренно запинен на пре-релизе — стабильная линия падает на TypeScript 7
      # (ts.SyntaxKind отсутствует в нативном компиляторе), см. CLAUDE.md → Codegen
      # drift gate. Снять игнор вместе со снятием пина, когда TS 7 поедет в стабильном
      # релизе openapi-ts (проверено эмпирически на 0.97.3/0.99.0 — падают).
      - dependency-name: "@hey-api/openapi-ts"

  # Базовые Docker-образы запинены по digest (supply-chain) — Dependabot поднимает PR при
  # выходе нового digest тега, иначе пины заморозили бы и security-патчи самих образов.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /ops
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # Минор Python в образе обязан совпадать с requires-python в backend/pyproject.toml:
      # при UV_PYTHON_DOWNLOADS=0 `uv sync --locked` не находит интерпретатор, а CI образ не
      # собирает и остаётся зелёным. Переход на новый минор — отдельная задача вместе с
      # requires-python; новые digest текущего минора по-прежнему приходят.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
